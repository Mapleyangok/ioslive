// ELivePusher Android aar 构建脚本
// 用法见 nativeplugins/ELivePusher/README.md：
// 1. 将 HBuilderX App 离线 SDK（uni-app Android SDK）中的 uniapp-v8-release.aar 放入本目录的 libs/ 下
// 2. Android Studio 打开本目录（File > Open），执行 assembleRelease
// 3. 将 build/outputs/aar/ELivePusher-release.aar 复制到本目录（与 build.gradle 平级），
//    云打包只识别 android/ 目录下的 .aar 文件

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 7.4.2：支持 compileSdk 30 与 JDK 11-17，配套 Gradle 7.5+
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.elive.pusher'
    compileSdkVersion 30
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // DCloud uni-app 基座（compileOnly：云打包时由基座提供）
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // uni-app 运行时已包含 fastjson，云打包时由基座提供
    compileOnly 'com.alibaba:fastjson:1.2.83'
    // WebRTC（org.webrtc 包名）与 RTMP 推流，云打包时由 package.json dependencies 注入
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
